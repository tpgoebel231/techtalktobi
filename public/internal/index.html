<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta http-equiv="X-Robots-Tag" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src https: data:; connect-src https://techtalktobi-review.vercel.app; base-uri 'none'; form-action 'none'">
<title>Comment review</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b0d11; --surface: #13161c; --surface-2: #1b1f28; --fg: #edebe6; --muted: #9a968e;
    --faint: #6b6862; --accent: #ff9800; --accent-fg: #0b0d11; --border: #2a2e36;
    --danger: #c47a6a; --ok: #7a9e7e; --warn: #c4a46a;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Outfit", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.5;
    min-height: 100dvh; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
  header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  h1 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; margin: 0; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: .85rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #3a3f4a; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-height: 44px; max-width: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  #login { max-width: 380px; margin: 12vh auto 0; }
  #login h1 { margin-bottom: 4px; }
  #login form { display: grid; gap: 12px; margin-top: 16px; }
  input[type=password] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-height: 48px; font-size: 16px; }
  .banner { border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; font-weight: 500; border: 1px solid; }
  .banner.ok { background: rgba(122,158,126,.12); border-color: var(--ok); color: #cfe3d1; }
  .banner.err { background: rgba(196,122,106,.12); border-color: var(--danger); color: #f0d3cc; }
  .banner.info { background: rgba(196,164,106,.10); border-color: var(--warn); color: #eadcc0; }
  .video { display: flex; gap: 14px; align-items: center; margin: 28px 0 12px; }
  .video:first-child { margin-top: 4px; }
  .video img { width: 128px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; flex: none; background: var(--surface-2); outline: 1px solid rgba(237,235,230,.1); outline-offset: -1px; }
  .video h2 { font-family: var(--display); font-weight: 600; font-size: 1.1rem; margin: 0 0 2px; line-height: 1.3; }
  .video a { color: var(--accent); font-size: .9rem; text-underline-offset: 3px; }
  .comment { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px 20px; margin-bottom: 14px; }
  .comment.decided { border-color: rgba(122,158,126,.55); }
  .comment.dirty { border-color: rgba(255,152,0,.55); }
  .author { font-weight: 600; word-break: break-word; }
  .stats { color: var(--faint); font-size: .8rem; margin: 2px 0 8px; }
  .text { white-space: pre-wrap; word-break: break-word; margin: 0; }
  .badge { display: inline-block; font-size: .75rem; border-radius: 999px; padding: 2px 10px; margin-top: 10px; border: 1px solid var(--border); color: var(--muted); }
  .badge.saved { border-color: var(--ok); color: #cfe3d1; }
  .badge.draft { border-color: var(--accent); color: #ffd19a; }
  label.lbl { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-height: 96px; resize: vertical; font-size: 16px; line-height: 1.45; }
  textarea:disabled { opacity: .5; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; border: 0; padding: 0; }
  .choices legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .choice { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; min-height: 44px; cursor: pointer; background: var(--surface-2); user-select: none; }
  .choice input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .choice:has(input:checked) { border-color: var(--accent); background: rgba(255,152,0,.12); }
  .instr { margin-top: 10px; }
  .instr[hidden] { display: none; }
  .instr textarea { min-height: 72px; }
  .pager { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .pager .row { gap: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  @media (max-width: 760px) {
    .comment { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    .video img { width: 96px; }
    .pager { flex-direction: column-reverse; align-items: stretch; }
    .pager .row { justify-content: space-between; }
    .pager button.primary { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="card" hidden>
    <h1>Comment <span>review</span></h1>
    <div class="meta">Private page. Enter the password to continue.</div>
    <form id="loginForm" autocomplete="off">
      <div id="loginMsg" class="banner err" hidden></div>
      <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Password" required aria-label="Password">
      <button class="primary" type="submit" id="loginBtn">Sign in</button>
    </form>
  </section>

  <section id="app" hidden>
    <header class="top">
      <div>
        <h1>Comment <span>review</span></h1>
        <div class="meta" id="batchMeta"></div>
      </div>
      <div class="row">
        <select id="batchSel" aria-label="Batch" hidden></select>
        <button type="button" id="reloadBtn">Reload</button>
        <button type="button" id="logoutBtn">Sign out</button>
      </div>
    </header>
    <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
    <form id="reviewForm" novalidate>
      <div id="list"></div>
      <div class="pager" id="pager" hidden>
        <div class="row">
          <button type="button" id="prevBtn">Previous</button>
          <span class="meta" id="pageInfo"></span>
          <button type="button" id="nextBtn">Next</button>
        </div>
        <button type="submit" class="primary" id="submitBtn">Submit this page</button>
      </div>
    </form>
  </section>
</div>
<script>
(() => {
  "use strict";
  const API = "https://techtalktobi-review.vercel.app";
  const PER_PAGE = 5;
  const TOKEN_KEY = "ttt-review-token";
  const DRAFT_PREFIX = "ttt-review-draft:";
  const $ = (id) => document.getElementById(id);

  let token = sessionStorage.getItem(TOKEN_KEY) || "";
  let batches = [], batch = null, flat = [], saved = new Map(), page = 0;

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids) if (c != null) n.append(c);
    return n;
  }

  function banner(kind, msg) {
    const b = $("banner");
    if (!msg) { b.hidden = true; return; }
    b.className = "banner " + kind;
    b.textContent = msg;
    b.hidden = false;
  }

  async function call(method, path, body) {
    const res = await fetch(API + path, {
      method,
      headers: Object.assign({ Authorization: "Bearer " + token }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store",
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (res.status === 401) {
      token = "";
      sessionStorage.removeItem(TOKEN_KEY);
      showLogin("Your session ended. Sign in again; your unsaved edits are kept on this device.");
      throw new Error("unauthorized");
    }
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  function showLogin(msg) {
    $("app").hidden = true;
    $("login").hidden = false;
    const m = $("loginMsg");
    m.hidden = !msg;
    m.textContent = msg || "";
    $("pw").value = "";
    setTimeout(() => $("pw").focus(), 0);
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn");
    btn.disabled = true;
    $("loginMsg").hidden = true;
    try {
      const res = await fetch(API + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: $("pw").value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.token) throw new Error(data.error || "Sign in failed");
      token = data.token;
      sessionStorage.setItem(TOKEN_KEY, token);
      $("pw").value = "";
      $("login").hidden = true;
      await load();
    } catch (err) {
      $("loginMsg").textContent = err.message === "wrong password" ? "Wrong password." : err.message;
      $("loginMsg").hidden = false;
    } finally {
      btn.disabled = false;
    }
  });

  $("logoutBtn").addEventListener("click", () => {
    token = "";
    sessionStorage.removeItem(TOKEN_KEY);
    showLogin("");
  });
  $("reloadBtn").addEventListener("click", () => load(batch && batch.batch_id, true));
  $("batchSel").addEventListener("change", (e) => { page = 0; load(e.target.value); });
  $("prevBtn").addEventListener("click", () => { if (page > 0) { page--; render(); scrollTo(0, 0); } });
  $("nextBtn").addEventListener("click", () => { if ((page + 1) * PER_PAGE < flat.length) { page++; render(); scrollTo(0, 0); } });

  async function load(batchId, keepPage) {
    $("app").hidden = false;
    banner("info", "Loading...");
    try {
      const data = await call("GET", "/api/review" + (batchId ? "?batch_id=" + encodeURIComponent(batchId) : ""));
      batches = data.batches || [];
      batch = data.batch;
      saved = new Map((data.decisions || []).map((d) => [d.comment_id, d]));
      flat = [];
      if (batch) for (const v of batch.videos) for (const c of v.comments) flat.push({ v, c });
      if (!keepPage) {
        const firstOpen = flat.findIndex(({ c }) => !saved.has(c.comment_id));
        page = firstOpen > 0 ? Math.floor(firstOpen / PER_PAGE) : 0;
      }
      page = Math.min(page, Math.max(0, Math.ceil(flat.length / PER_PAGE) - 1));
      banner(null);
      render();
    } catch (err) {
      if (err.message !== "unauthorized") banner("err", "Could not load comments: " + err.message);
    }
  }

  const draftKey = (cid) => DRAFT_PREFIX + batch.batch_id + ":" + cid;
  function getDraft(cid) {
    try { return JSON.parse(localStorage.getItem(draftKey(cid)) || "null"); } catch (e) { return null; }
  }
  function setDraft(cid, d) { try { localStorage.setItem(draftKey(cid), JSON.stringify(d)); } catch (e) {} }
  function clearDraft(cid) { try { localStorage.removeItem(draftKey(cid)); } catch (e) {} }

  function fmtDate(s) {
    if (!s) return "";
    const d = new Date(s);
    return isNaN(d) ? "" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  }
  const actionName = { post: "Post", skip: "Skip", instructions: "Instructions" };

  function render() {
    const list = $("list");
    list.replaceChildren();
    const sel = $("batchSel");
    sel.replaceChildren(...batches.map((b) => el("option", { value: b.batch_id, text: b.batch_id, selected: batch && b.batch_id === batch.batch_id })));
    sel.hidden = batches.length < 2;
    if (!batch) {
      $("batchMeta").textContent = "";
      list.append(el("div", { class: "empty", text: "No comment batch yet." }));
      $("pager").hidden = true;
      return;
    }
    const decided = flat.filter(({ c }) => saved.has(c.comment_id)).length;
    $("batchMeta").textContent = "Batch " + batch.batch_id + (batch.generated_at ? " \u00b7 generated " + fmtDate(batch.generated_at) : "") + " \u00b7 " + decided + " of " + flat.length + " decided";
    const pages = Math.max(1, Math.ceil(flat.length / PER_PAGE));
    const items = flat.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);
    let lastVideo = null;
    for (const { v, c } of items) {
      if (v !== lastVideo) {
        lastVideo = v;
        const info = el("div", {}, el("h2", { text: v.title || "Untitled video" }));
        if (v.url && /^https:\/\//.test(v.url)) info.append(el("a", { href: v.url, target: "_blank", rel: "noopener noreferrer", text: "Open video" }));
        const head = el("div", { class: "video" });
        if (v.thumb && /^https:\/\//.test(v.thumb)) head.append(el("img", { src: v.thumb, alt: "", loading: "lazy" }));
        head.append(info);
        list.append(head);
      }
      list.append(renderComment(c));
    }
    if (!items.length) list.append(el("div", { class: "empty", text: "This batch has no comments." }));
    $("pager").hidden = false;
    $("pageInfo").textContent = "Page " + (page + 1) + " of " + pages;
    $("prevBtn").disabled = page === 0;
    $("nextBtn").disabled = page >= pages - 1;
  }

  function renderComment(c) {
    const cid = c.comment_id;
    const s = saved.get(cid);
    const d = getDraft(cid);
    const state = d || (s ? { action: s.action, reply_text: s.reply_text || c.proposed_reply || "", instructions: s.instructions || "" } : { action: "", reply_text: c.proposed_reply || "", instructions: "" });
    const name = "act-" + cid;

    const stats = [fmtDate(c.published_at), typeof c.like_count === "number" ? c.like_count + (c.like_count === 1 ? " like" : " likes") : ""].filter(Boolean).join(" \u00b7 ");
    const badge = el("span", { class: "badge" });
    const left = el("div", {},
      el("div", { class: "author", text: c.author || "Unknown" }),
      stats ? el("div", { class: "stats", text: stats }) : null,
      el("p", { class: "text", text: c.text || "" }),
      badge);

    const reply = el("textarea", { id: "r-" + cid, rows: "4" });
    reply.value = state.reply_text;
    const instr = el("textarea", { id: "i-" + cid, rows: "3", placeholder: "What should happen with this comment?" });
    instr.value = state.instructions || "";
    const instrBox = el("div", { class: "instr", hidden: state.action !== "instructions" }, el("label", { class: "lbl", for: "i-" + cid, text: "Instructions" }), instr);
    const radios = ["post", "skip", "instructions"].map((a) => {
      const r = el("input", { type: "radio", name, value: a, checked: state.action === a });
      return el("label", { class: "choice" }, r, actionName[a]);
    });
    const choices = el("fieldset", { class: "choices" }, el("legend", { text: "Action" }), ...radios);
    const right = el("div", {}, el("label", { class: "lbl", for: "r-" + cid, text: "Reply" }), reply, choices, instrBox);
    const card = el("div", { class: "card comment", "data-cid": cid }, left, right);

    function current() {
      const chk = choices.querySelector("input:checked");
      return { action: chk ? chk.value : "", reply_text: reply.value, instructions: instr.value };
    }
    function paint() {
      const cur = current();
      instrBox.hidden = cur.action !== "instructions";
      reply.disabled = cur.action === "skip";
      const isDirty = !!getDraft(cid);
      card.classList.toggle("dirty", isDirty);
      card.classList.toggle("decided", !isDirty && !!s);
      if (isDirty) { badge.className = "badge draft"; badge.textContent = "Unsaved changes"; }
      else if (s) { badge.className = "badge saved"; badge.textContent = "Saved: " + actionName[s.action] + " \u00b7 " + fmtDate(s.decided_at); }
      else { badge.className = "badge"; badge.textContent = "Open"; }
    }
    function onEdit() {
      const cur = current();
      const base = s ? { action: s.action, reply_text: s.reply_text || c.proposed_reply || "", instructions: s.instructions || "" } : { action: "", reply_text: c.proposed_reply || "", instructions: "" };
      if (cur.action === base.action && cur.reply_text === base.reply_text && (cur.action !== "instructions" || cur.instructions === base.instructions)) clearDraft(cid);
      else setDraft(cid, cur);
      paint();
    }
    choices.addEventListener("change", () => { onEdit(); if (current().action === "instructions") instr.focus(); });
    reply.addEventListener("input", onEdit);
    instr.addEventListener("input", onEdit);
    card._current = current;
    paint();
    return card;
  }

  $("reviewForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!batch) return;
    const cards = [...document.querySelectorAll(".comment[data-cid]")];
    const decisions = [], problems = [];
    let open = 0;
    for (const card of cards) {
      const cid = card.getAttribute("data-cid");
      const cur = card._current();
      if (!cur.action) { open++; continue; }
      if (saved.has(cid) && !getDraft(cid)) continue;
      if (cur.action === "post" && !cur.reply_text.trim()) problems.push("a reply marked Post is empty");
      if (cur.action === "instructions" && !cur.instructions.trim()) problems.push("an Instructions box is empty");
      decisions.push({ comment_id: cid, action: cur.action, reply_text: cur.reply_text, instructions: cur.action === "instructions" ? cur.instructions : "" });
    }
    if (problems.length) { banner("err", "Not submitted: " + [...new Set(problems)].join(", ") + "."); return; }
    if (!decisions.length) {
      if (cards.length && !open) banner("info", "Nothing new to save on this page. All decisions here are already saved.");
      else banner("err", "Not submitted: choose Post, Skip or Instructions for at least one comment on this page.");
      return;
    }
    const btn = $("submitBtn");
    btn.disabled = true;
    banner("info", "Saving...");
    try {
      const r = await call("POST", "/api/decisions", { batch_id: batch.batch_id, decisions });
      for (const d of r.decisions) { saved.set(d.comment_id, d); clearDraft(d.comment_id); }
      render();
      banner("ok", "Saved " + r.saved + " decision" + (r.saved === 1 ? "" : "s") + " on page " + (page + 1) + "." + (open ? " " + open + " comment" + (open === 1 ? " is" : "s are") + " still open on this page." : ""));
    } catch (err) {
      if (err.message !== "unauthorized") banner("err", "Not saved: " + err.message + ". Your edits are kept on this device; try again.");
    } finally {
      btn.disabled = false;
      $("banner").scrollIntoView({ block: "nearest" });
    }
  });

  if (token) load(); else showLogin("");
})();
</script>
</body>
</html>
