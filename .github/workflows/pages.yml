# Build-only. The github-pages environment rejects main, so this workflow
# does not deploy. Manual dispatch builds the static site and uploads the
# Pages artifact, then exits green. Live static hosting is the gh-pages
# branch; Vercel ignores that branch (see vercel.json).
#
# Does not touch tpgoebel231/techtalktobi-old.

name: Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_AUTH_ENABLED: "false"
      NITRO_PRESET: github_pages
      # Helga button: HELGA_CALL_BUTTON_ENABLED in src/lib/helga.ts.
      # Leave it a source constant. A VITE_ var here would not match Vercel.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npx vite build
      - name: Prepare Pages files
        run: node scripts/prepare-github-pages.mjs dist/client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
